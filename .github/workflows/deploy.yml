name: Deploy IRRAM AI and secure live chat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IRRAM_CHAT_API_URL: ${{ vars.IRRAM_CHAT_API_URL }}
        run: |
          set -eu
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::Missing GitHub secret OPENAI_API_KEY"; exit 1; }
          [ -n "$IRRAM_CHAT_API_URL" ] || { echo "::error::Missing GitHub Actions variable IRRAM_CHAT_API_URL"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@3

      - name: Store OpenAI key in Cloudflare Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY --name irram-ai

      - name: Deploy secure chat Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config worker/wrangler.toml

      - name: Create public chat endpoint config
        env:
          IRRAM_CHAT_API_URL: ${{ vars.IRRAM_CHAT_API_URL }}
        run: |
          node -e "require('fs').writeFileSync('chat-config.js', 'window.IRRAM_CHAT_API_URL = '+JSON.stringify(process.env.IRRAM_CHAT_API_URL)+';\\n')"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
